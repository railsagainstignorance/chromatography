# Page Registry for Screenshot Tool
# Usage: npm run screenshot -- <page_key>
# Or:    npm run screenshot -- --all

defaults:
  width: 800
  height: 800
  timeout: 60000   # ms to wait for simulation completion

pages:
  default:
    path: /?size=40
    description: Default simulation (40x40 grid, default config)

  small:
    path: /?size=20
    description: Small grid for quick runs
    timeout: 30000

  large:
    path: /?size=100
    description: Large grid (100x100, default)
    timeout: 120000

  cmyk:
    path: /?size=40&dyeSpace=cmyk
    description: CMYK color space rendering

  water-source:
    path: /?size=40&WaterSourceEnabled=true&WaterSourceAmountPerCell=0.01&WaterSourceMaxPerCell=0.5&Processes=["waterSource","absorption","desorption","surfaceFlow","capillaryFlow","diffusion","evaporation","sanityCheckValue"]&dropsNum=3&dropsXRange=[0.3,0.7]&dropsYRange=[0.12,0.18]&dropsVRange=[0.01,0.02]&dropsDRange=[5000,10000]&dropsRRange=[0.01,0.02]&maxIterations=2000
    description: Water source at top edge with concentrated dye spots below
    timeout: 120000
