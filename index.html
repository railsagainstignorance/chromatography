<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chromatography</title>
  <style>
  html {
    font-family: sans-serif;
  }
  .blotting-paper {
    border-width: 1px;
    border-color: lightgrey;
    border-style: solid;

    box-shadow: 10px 10px 5px #888888;

    background-color: white;
  }
  #myCanvas {
    /* display size is set by JS based on maxCellSize config */
    image-rendering: pixelated;
  }
  .remove {
    display:none;
  }

  #presets {
    margin: 10px 0;
  }
  #presets button {
    margin-right: 8px;
    padding: 6px 14px;
    font-size: 14px;
    cursor: pointer;
  }

  #configparams form table td {
    border: 1px solid lightgrey;
  }

  </style>
  <script src="assets/cellauto.min.js"></script>
  <script>
    window.requestAnimationFrame = window.requestAnimationFrame || window.mozRequestAnimationFrame || window.webkitRequestAnimationFrame || window.msRequestAnimationFrame;
  </script>
  <script type="module" src="src/main.js"></script>
</head>

<body>
  <h1>Chromatography</h1>

    <canvas class="blotting-paper" id="myCanvas" width="100" height="100"></canvas>

  <div id="presets"></div>

  <div class="remove" id="configparams">
    <h2>Config Params</h2>

    <form action="" id="configparamsform">
    </form>

  </div>

  <script type="module">
  import { createPaper } from './src/main.js';

  (function(){
    const queryString = location.search;
    const paper = createPaper( document.getElementById('myCanvas'), queryString );
    Chroma.writePresetsToElement( document.getElementById('presets') );
    if (queryString !== "") {
      const configparamsElt = document.getElementById('configparams');
      configparamsElt.classList.remove('remove');
      paper.writeParamsToForm( document.getElementById('configparamsform') );
    }
    window.setTimeout(paper.run, 100);
  })();
  </script>
</body>
</html>
